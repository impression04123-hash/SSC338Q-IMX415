# SSC338Q + IMX415. Confirm sensor mode and legal RF settings on the board.
[system]
role=air
[video]
backend=sigmastar
sensor=imx415
sensor_mode=0
width=1920
height=1080
fps=30
bitrate_kbps=6000
gop=30
max_frames=0
loop=0
[transport]
type=udp
host=127.0.0.1
bind_host=127.0.0.1
port=5602
mtu=1200
payload_type=96
ssrc=0x46505601
random_ssrc=1
socket_rcvbuf=4194304
fragment_timeout_ms=250
[wireless]
enabled=1
iface=wlan0
driver=8812eu
channel=161
bandwidth=20
mcs=2
fec_k=8
fec_n=12
link_id=7669206
radio_port=0
key_path=/etc/fpv/drone.key
# 0 leaves driver transmit power unchanged; nonzero uses iw fixed mBm.
txpower_mbm=0
[osd]
enabled=1
serial_device=/dev/ttyS2
serial_baud=115200
fps=20
[runtime]
stats_interval_ms=1000
idle_exit_ms=0
restart_limit=3
restart_delay_ms=1000
log_dir=/var/log/fpv
run_dir=/run/fpv
bin_dir=/usr/bin
