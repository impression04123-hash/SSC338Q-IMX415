# Run from the project directory after generating samples/demo.h265.
[system]
role=air
[video]
backend=file
source=samples/demo.h265
width=320
height=240
fps=30
max_frames=0
loop=0
[transport]
type=udp
host=127.0.0.1
bind_host=127.0.0.1
port=5600
mtu=1200
payload_type=96
ssrc=0x46505601
random_ssrc=1
[wireless]
enabled=0
[osd]
enabled=0
[runtime]
stats_interval_ms=1000
idle_exit_ms=0
restart_limit=2
restart_delay_ms=250
log_dir=/tmp/fpv-demo/log
run_dir=/tmp/fpv-demo/run
bin_dir=build/host
