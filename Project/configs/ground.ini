# Reference Hi3536DV100 VDEC/VO/HDMI backend. Verify actual board SDK ABI.
[system]
role=ground
[video]
backend=hisilicon
width=1920
height=1080
fps=30
output_mode=1080p60
display_buffers=3
max_frames=0
[transport]
type=udp
host=127.0.0.1
bind_host=127.0.0.1
port=5600
mtu=1200
payload_type=96
ssrc=0x46505601
socket_rcvbuf=4194304
fragment_timeout_ms=250
[wireless]
enabled=1
iface=wlan0
driver=8812eu
channel=161
bandwidth=20
mcs=2
fec_k=8
fec_n=12
link_id=7669206
radio_port=0
key_path=/etc/fpv/gs.key
txpower_mbm=0
[osd]
enabled=0
[runtime]
stats_interval_ms=1000
idle_exit_ms=0
restart_limit=3
restart_delay_ms=1000
log_dir=/var/log/fpv
run_dir=/run/fpv
bin_dir=/usr/bin
