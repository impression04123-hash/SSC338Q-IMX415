# Start before demo-air. Exit cleanly after three seconds without packets.
[system]
role=ground
[video]
backend=file
output=received.h265
width=320
height=240
fps=30
max_frames=0
[transport]
type=udp
host=127.0.0.1
bind_host=127.0.0.1
port=5600
mtu=1200
payload_type=96
ssrc=0x46505601
socket_rcvbuf=4194304
fragment_timeout_ms=250
[wireless]
enabled=0
[osd]
enabled=0
[runtime]
stats_interval_ms=1000
idle_exit_ms=3000
restart_limit=2
restart_delay_ms=250
log_dir=/tmp/fpv-demo/log
run_dir=/tmp/fpv-demo/run
bin_dir=build/host
